<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#8f73c4">
  <meta name="description" content="有些话，还没有说完。">
  <title>1u · 有些话，还没有说完</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="game-shell" aria-labelledby="game-title">
    <div class="room" aria-hidden="true"></div>
    <div class="night-glow" aria-hidden="true"></div>
    <div class="stars" id="stars" aria-hidden="true"></div>

    <nav class="utility-controls" aria-label="页面设置">
      <button class="icon-button" id="sound-toggle" type="button" aria-label="关闭全部声音" aria-pressed="false">
        <svg class="sound-icon sound-icon--on" aria-hidden="true" viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4Z"/><path d="M16 9.2c1.2 1.5 1.2 4.1 0 5.6M18.8 6.5c3 3 3 8 0 11"/></svg>
        <svg class="sound-icon sound-icon--off" aria-hidden="true" viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4Z"/><path d="m17 9 5 5m0-5-5 5"/></svg>
      </button>
      <button class="icon-button" id="audio-settings-toggle" type="button" aria-label="打开声音设置" aria-expanded="false" aria-controls="audio-settings">
        <svg class="settings-icon" aria-hidden="true" viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h2m4 0h10M9 4v6M7 14v6"/></svg>
      </button>
      <section class="audio-settings" id="audio-settings" aria-label="声音设置" hidden>
        <div class="audio-setting-row">
          <label for="bgm-volume">BGM</label>
          <output id="bgm-value" for="bgm-volume">55%</output>
          <input id="bgm-volume" type="range" min="0" max="100" value="55">
        </div>
        <div class="audio-setting-row">
          <label for="sfx-volume">音效</label>
          <output id="sfx-value" for="sfx-volume">65%</output>
          <input id="sfx-volume" type="range" min="0" max="100" value="65">
        </div>
      </section>
    </nav>

    <header class="title-block">
      <h1 class="logo" id="game-title">
        <span class="logo-orbit" aria-hidden="true"></span>
        <span>1u</span>
        <span class="logo-heart" aria-hidden="true">♥</span>
      </h1>
      <p>有些话，还没有说完。</p>
    </header>

    <section class="story-stage" aria-label="陈沐言和陈子滕">
      <div class="character character--girl" aria-label="陈沐言">
        <img class="character-sprite" src="assets/girl-casual.png" data-open="assets/girl-casual.png" data-closed="assets/girl-casual-blink.png" alt="陈沐言的像素角色">
      </div>

      <div class="message-window" aria-hidden="true">
        <div class="window-dots"><i></i><i></i><i></i></div>
        <div class="bubble bubble--left"><span></span><span></span><span></span></div>
        <div class="bubble bubble--right"><span></span><span></span><span></span></div>
        <div class="message-input"><span class="cursor-line"></span><span class="send-arrow">➤</span></div>
        <span class="pixel-heart">♥</span>
      </div>

      <div class="character character--boy" aria-label="陈子滕">
        <img class="character-sprite" src="assets/boy-casual.png" data-open="assets/boy-casual.png" data-closed="assets/boy-casual-blink.png" alt="陈子滕的像素角色">
      </div>
    </section>

    <section class="start-panel" aria-label="游戏菜单">
      <button class="start-button" id="start-button" type="button">
        <span aria-hidden="true">♥</span><strong>开始</strong><span aria-hidden="true">♥</span>
      </button>
      <button class="continue-button" id="continue-button" type="button">继续</button>
      <p class="status-message" id="status-message" aria-live="polite"></p>
    </section>
  </main>
  <script src="js/script.js"></script>
</body>
</html>
